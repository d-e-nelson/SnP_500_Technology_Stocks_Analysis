

<svg width="1500" height="390">
  <!-- Text above circles -->
  <g fill="#636466" style="font-size:30px; font-family:san-serif; font-weight:bold">
        <text x='20' y='20'>Click the Circles to Toggle Their Color</text>
  </g>
  
  <!-- Circles -->
  <g class="circle-group" transform="translate(50, 50)"></g>
  
   <!-- Text above rectangles -->
  <g fill="#636466" style="font-size:30px; font-family:sans-serif; font-weight:bold">
    <text id="rect-text" x="20" y="230">Button Will Move Rectangles to the Right</text>
  </g>
  
  <!-- Rectangles -->
  <g class="rect-group" transform="translate(50, 60)"></g>
</svg>

<!-- Button for Rectangle movement and text transition -->
<div class="button-container">
  <button id="move-btn">Move Rectangles</button>
</div>
